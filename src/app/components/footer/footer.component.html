<footer class="relative border-t border-white/10 bg-slate-950 text-slate-300 py-12 px-4 font-sans">
  <div class="mx-auto max-w-7xl flex flex-col items-center justify-between gap-6 sm:flex-row">
    <!-- Left Identity -->
    <div class="flex flex-col items-center text-center sm:items-start sm:text-left">
      <p class="text-lg font-bold text-white tracking-tight">{{ portfolio.name }}</p>
      <p class="text-xs text-slate-400 mt-1">
        &copy; {{ currentYear }} {{ portfolio.name }}. All rights reserved. Built with Angular & TypeScript.
      </p>
    </div>

    <!-- Center Social Vector Buttons -->
    <ul class="flex items-center gap-4" aria-label="Footer Social Links">
      <li>
        <a
          [href]="portfolio.github"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="GitHub Profile"
          class="inline-flex h-10 w-10 items-center justify-center rounded-full border border-white/10 bg-slate-900 text-slate-300 transition duration-300 hover:border-brand-accent hover:text-white hover:shadow-glow-accent">
          <svg class="h-5 w-5" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/>
          </svg>
        </a>
      </li>
      <li>
        <a
          [href]="portfolio.linkedin"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="LinkedIn Profile"
          class="inline-flex h-10 w-10 items-center justify-center rounded-full border border-white/10 bg-slate-900 text-slate-300 transition duration-300 hover:border-brand-accent hover:text-white hover:shadow-glow-accent">
          <svg class="h-5 w-5" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.28 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.75M6.46 10.9v8.37H9.25V10.9H6.46M7.86 6.75a1.46 1.46 0 1 0 0 2.92 1.46 1.46 0 0 0 0-2.92z"/>
          </svg>
        </a>
      </li>
    </ul>

    <!-- Right Back to Top Button -->
    <button
      type="button"
      (click)="scrollToTop()"
      aria-label="Scroll back to top"
      class="inline-flex items-center gap-2 rounded-full border border-white/10 bg-slate-900 px-4 py-2 text-xs font-semibold text-slate-300 transition duration-300 hover:border-brand-accent hover:text-white hover:shadow-glow-accent focus:outline-none">
      Back to Top
      <svg class="h-4 w-4 text-brand-accent-light" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 10l7-7m0 0l7 7m-7-7v18" />
      </svg>
    </button>
  </div>
</footer>
