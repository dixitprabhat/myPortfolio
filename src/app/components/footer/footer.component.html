<footer class="relative theme-nav border-t py-12 px-4 font-sans transition-colors duration-300">
  <div class="mx-auto max-w-7xl flex flex-col items-center justify-between gap-6 sm:flex-row">
    <!-- Left Identity -->
    <div class="flex flex-col items-center text-center sm:items-start sm:text-left">
      <p class="text-lg font-bold tracking-tight" style="color: var(--text-heading)">{{ portfolio.name }}</p>
      <p class="text-xs mt-1" style="color: var(--text-muted)">
        &copy; {{ currentYear }} {{ portfolio.name }}. All rights reserved. Built with Angular & TypeScript.
      </p>
    </div>

    <!-- Right Back to Top Button -->
    <button
      type="button"
      (click)="scrollToTop()"
      aria-label="Scroll back to top"
      class="btn-outline text-xs px-4 py-2 flex items-center gap-2 rounded-full shadow-sm">
      Back to Top
      <svg class="h-4 w-4 text-indigo-600 dark:text-indigo-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 10l7-7m0 0l7 7m-7-7v18" />
      </svg>
    </button>
  </div>
</footer>
