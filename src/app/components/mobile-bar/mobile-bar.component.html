<!-- Mobile Sticky Bottom Quick-Action Bar -->
<div class="fixed bottom-0 left-0 z-40 w-full md:hidden p-2.5 bg-slate-950/90 border-t border-sky-500/20 backdrop-blur-xl shadow-2xl">
  <div class="grid grid-cols-4 gap-1.5 max-w-sm mx-auto text-center font-mono">
    
    <!-- Phone Call Button -->
    <button
      type="button"
      (click)="callPhone()"
      class="flex flex-col items-center justify-center p-1.5 rounded-xl bg-slate-900 border border-slate-800 hover:border-emerald-500 text-emerald-400 transition-colors">
      <svg class="h-4 w-4 mb-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" />
      </svg>
      <span class="text-[9px] uppercase tracking-wider">Call</span>
    </button>

    <!-- Copy Email Button -->
    <button
      type="button"
      (click)="copyEmail()"
      class="flex flex-col items-center justify-center p-1.5 rounded-xl bg-slate-900 border border-slate-800 hover:border-sky-500 text-sky-400 transition-colors">
      <svg class="h-4 w-4 mb-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
      </svg>
      <span class="text-[9px] uppercase tracking-wider">Email</span>
    </button>

    <!-- Resume PDF Button -->
    <button
      type="button"
      (click)="openResume()"
      class="flex flex-col items-center justify-center p-1.5 rounded-xl bg-slate-900 border border-slate-800 hover:border-indigo-500 text-indigo-400 transition-colors">
      <svg class="h-4 w-4 mb-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
      </svg>
      <span class="text-[9px] uppercase tracking-wider">Resume</span>
    </button>

    <!-- GitHub Profile Button -->
    <button
      type="button"
      (click)="openGithub()"
      class="flex flex-col items-center justify-center p-1.5 rounded-xl bg-slate-900 border border-slate-800 hover:border-violet-500 text-violet-400 transition-colors">
      <svg class="h-4 w-4 mb-0.5" fill="currentColor" viewBox="0 0 24 24">
        <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/>
      </svg>
      <span class="text-[9px] uppercase tracking-wider">GitHub</span>
    </button>
  </div>
</div>
