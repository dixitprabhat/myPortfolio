<section id="home" class="section-shell min-h-[92vh] flex items-center pt-28 pb-16">
  <!-- Background Glow Orbs -->
  <div class="pointer-events-none absolute top-1/4 left-10 h-72 w-72 rounded-full bg-brand-accent/20 blur-3xl animate-pulse-glow" aria-hidden="true"></div>
  <div class="pointer-events-none absolute bottom-10 right-10 h-80 w-80 rounded-full bg-brand-secondary/20 blur-3xl animate-pulse-glow" aria-hidden="true"></div>

  <div class="mx-auto grid w-full max-w-7xl grid-cols-1 items-center gap-12 lg:grid-cols-12 lg:gap-16">
    <!-- Left Hero Information Column -->
    <div class="order-2 text-center lg:order-1 lg:col-span-7 lg:text-left animate-fade-up">
      <!-- Status Badge -->
      <div class="inline-flex items-center gap-2 rounded-full border border-emerald-500/30 bg-emerald-500/10 px-4 py-1.5 text-xs font-semibold text-emerald-400 mb-6">
        <span class="relative flex h-2 w-2">
          <span class="absolute inline-flex h-full w-full animate-ping rounded-full bg-emerald-400 opacity-75"></span>
          <span class="relative inline-flex h-2 w-2 rounded-full bg-emerald-500"></span>
        </span>
        {{ portfolio.availability }}
      </div>

      <h1 class="text-4xl font-extrabold tracking-tight text-white sm:text-5xl lg:text-6xl leading-[1.15]">
        Hi, I'm <span class="bg-gradient-to-r from-brand-accent-light via-brand-secondary to-indigo-300 bg-clip-text text-transparent">{{ portfolio.name }}</span>
      </h1>

      <p class="mt-4 text-xl font-semibold text-slate-300 sm:text-2xl">
        {{ portfolio.role }}
      </p>

      <p class="mt-6 max-w-2xl text-base leading-relaxed text-slate-400 sm:text-lg">
        {{ portfolio.summary }}
      </p>

      <!-- Action Buttons -->
      <div class="mt-8 flex flex-wrap items-center justify-center gap-4 lg:justify-start">
        <button type="button" class="btn-primary shadow-glow-accent" (click)="scrollTo('projects')">
          Explore Projects
          <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3" />
          </svg>
        </button>

        <button type="button" class="btn-outline" (click)="scrollTo('contact')">
          Get In Touch
        </button>

        <app-popup></app-popup>
      </div>

      <!-- Social Media Bar -->
      <div class="mt-10 flex items-center justify-center gap-4 pt-6 border-t border-white/10 lg:justify-start">
        <span class="text-xs font-semibold tracking-wider text-slate-500 uppercase">Connect With Me:</span>
        <a
          [href]="portfolio.github"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="GitHub Profile"
          class="flex h-10 w-10 items-center justify-center rounded-xl border border-white/10 bg-slate-900/60 text-slate-300 transition-all hover:border-brand-accent hover:text-white hover:shadow-glow-accent">
          <svg class="h-5 w-5" fill="currentColor" viewBox="0 0 24 24">
            <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/>
          </svg>
        </a>

        <a
          [href]="portfolio.linkedin"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="LinkedIn Profile"
          class="flex h-10 w-10 items-center justify-center rounded-xl border border-white/10 bg-slate-900/60 text-slate-300 transition-all hover:border-brand-accent hover:text-white hover:shadow-glow-accent">
          <svg class="h-5 w-5" fill="currentColor" viewBox="0 0 24 24">
            <path d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.28 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.75M6.46 10.9v8.37H9.25V10.9H6.46M7.86 6.75a1.46 1.46 0 1 0 0 2.92 1.46 1.46 0 0 0 0-2.92z"/>
          </svg>
        </a>
      </div>
    </div>

    <!-- Right Profile Image Column -->
    <div class="order-1 flex justify-center lg:order-2 lg:col-span-5 animate-fade-up">
      <figure class="relative group">
        <!-- Glow Aura Ring -->
        <div class="absolute -inset-4 rounded-full bg-gradient-to-tr from-brand-accent via-brand-secondary to-indigo-500 opacity-40 blur-2xl transition duration-500 group-hover:opacity-75" aria-hidden="true"></div>
        
        <img
          class="relative h-64 w-64 rounded-full border-4 border-white/20 object-cover shadow-2xl transition duration-500 group-hover:scale-[1.02] sm:h-80 sm:w-80 lg:h-96 lg:w-96"
          src="assets/images/homePP.jpeg"
          alt="Portrait of Prabhat Dixit"
          width="384"
          height="384"
          loading="eager"
          fetchpriority="high"
          decoding="async" />
      </figure>
    </div>
  </div>
</section>
