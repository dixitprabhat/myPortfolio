@if (isLoading()) {
  <div class="fixed inset-0 z-[100] flex flex-col items-center justify-center bg-brand-bg text-white" role="status" aria-label="Loading portfolio">
    <div class="relative flex h-14 w-14 items-center justify-center">
      <div class="absolute h-full w-full animate-ping rounded-full bg-brand-accent/30"></div>
      <div class="h-10 w-10 animate-spin rounded-full border-3 border-brand-accent border-t-transparent shadow-glow-accent"></div>
    </div>
    <span class="mt-4 text-xs font-semibold tracking-widest text-slate-400 uppercase">Loading Experience...</span>
  </div>
} @else {
  @if (showHead()) {
    <app-header></app-header>
  }
  <router-outlet></router-outlet>
  @if (showHead()) {
    <app-footer></app-footer>
  }
}
